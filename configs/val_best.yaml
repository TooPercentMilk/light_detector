detector:
  type: "yolox"
  model_path: "runs/train/detector/best.pth"
  device: "cuda"
  input_size: [960, 960]
  confidence_threshold: 0.2
  nms_threshold: 0.45
  num_classes: 1
  exp_name: "yolox-m"

tracker:
  type: "bytetrack"
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  frame_rate: 30

classifier:
  type: "cnn"
  model_path: "runs/train/classifier/best.pth"
  device: "cuda"
  input_size: [32, 64]
  classes: ["red", "yellow", "green", "off"]

temporal_smoother:
  window_size: 5
  min_consensus: 3

preprocess:
  input_size: [960, 960]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  swap_rb: true
